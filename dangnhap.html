<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập - Phúc Khang</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dangnhap.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">‹ Về trang chủ</a>

  <section class="box">
    <img class="logo" src="image/logo.png" alt="Phúc Khang">
    <h1>Tài khoản</h1>
    <p class="sub">Đăng nhập hoặc tạo tài khoản mới</p>

    <div class="tabs" role="tablist" aria-label="Chế độ tài khoản">
      <button type="button" role="tab" id="tabUser" aria-selected="true" aria-controls="panelUser">Đăng nhập</button>
      <button type="button" role="tab" id="tabRegister" aria-selected="false" aria-controls="panelRegister" tabindex="-1">Đăng ký</button>
      <button type="button" role="tab" id="tabAdmin" aria-selected="false" aria-controls="panelAdmin" tabindex="-1">Quản trị viên</button>
    </div>

    <!-- Tab 1: đăng nhập (kèm chế độ khách bên dưới) -->
    <form id="panelUser" role="tabpanel" aria-labelledby="tabUser" novalidate>
      <label for="email">Gmail hoặc tên đăng nhập</label>
      <input id="email" type="text" autocomplete="username" placeholder="abcxyz hoặc abcxyz@gmail.com">

      <label for="pass">Mật khẩu</label>
      <div class="pass">
        <input id="pass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
        <button type="button" class="toggle-pass" data-for="pass" aria-label="Hiện mật khẩu">Hiện</button>
      </div>

      <p id="msg" class="msg" role="alert" aria-live="polite"></p>
      <button type="submit" class="primary">Đăng nhập</button>
      <p class="hint">Tài khoản thử nghiệm: <b>abcxyz</b> / mật khẩu <b>123</b></p>

      <div class="divider"><span>hoặc</span></div>
      <button type="button" id="guestBtn" class="ghost">Tiếp tục với tư cách khách</button>
      <p class="hint small">Khách xem được sản phẩm và thêm vào giỏ, nhưng cần có tài khoản để thanh toán.</p>
    </form>

    <!-- Tab 2: đăng ký -->
    <form id="panelRegister" role="tabpanel" aria-labelledby="tabRegister" novalidate hidden>
      <label for="rUser">Tên đăng nhập</label>
      <input id="rUser" type="text" autocomplete="username" placeholder="3-20 ký tự: chữ thường, số, gạch dưới">

      <label for="rEmail">Email</label>
      <input id="rEmail" type="email" autocomplete="email" placeholder="ten@gmail.com">

      <label for="rPass">Mật khẩu</label>
      <div class="pass">
        <input id="rPass" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự">
        <button type="button" class="toggle-pass" data-for="rPass" aria-label="Hiện mật khẩu">Hiện</button>
      </div>

      <label for="rPass2">Nhập lại mật khẩu</label>
      <input id="rPass2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu">

      <p id="rMsg" class="msg" role="alert" aria-live="polite"></p>
      <button type="submit" class="primary">Tạo tài khoản</button>
    </form>

    <!-- Tab 3: quản trị viên -->
    <form id="panelAdmin" role="tabpanel" aria-labelledby="tabAdmin" novalidate hidden>
      <p class="admin-note">Khu vực dành riêng cho quản trị viên của cửa hàng.</p>

      <label for="adminUser">Tên quản trị</label>
      <input id="adminUser" type="text" autocomplete="username" placeholder="Tên đăng nhập quản trị">

      <label for="adminPass">Mật khẩu quản trị</label>
      <div class="pass">
        <input id="adminPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu quản trị">
        <button type="button" class="toggle-pass" data-for="adminPass" aria-label="Hiện mật khẩu">Hiện</button>
      </div>

      <p id="adminMsg" class="msg" role="alert" aria-live="polite"></p>
      <button type="submit" class="primary admin">Đăng nhập quản trị</button>
      <p class="hint">Tài khoản thử nghiệm: <b>admin</b> / mật khẩu <b>admin123</b></p>
    </form>
  </section>
</main>
<script src="dangnhap.js"></script>
</body>
</html>
